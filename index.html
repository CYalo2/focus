<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>

<style>
@font-face {
    font-family: 'Silkscreen';
    font-weight: 400;
    font-style: normal;
    font-display: block;
    src: url('assets/fonts/silkscreen-latin-400-normal.woff2') format('woff2');
}

html, body {
    margin: 0;
    padding: 0;
    background: #111;
    height: 100%;
    overflow: hidden;
    font-family: 'Silkscreen', 'Courier New', monospace;
}

#game-container {
    position: absolute;
    line-height: 0;
    box-shadow: 0 0 24px rgba(0,0,0,.6);
}

#level-select-banner-container {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 320px;
    height: 50px;
    z-index: 10;
}

#game-container canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}
</style>
</head>

<body>

<div id="game-container">
<div id="level-select-banner-container"></div>
</div>

<script type="module" src="./main.js"></script>

</body>
</html>
